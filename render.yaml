# Render Blueprint: one Docker web service + one managed PostgreSQL.
# Render dashboard → New → Blueprint → pick this repo → Apply.
services:
  - type: web
    name: timber-and-grain
    runtime: docker
    plan: free            # upgrade to "starter" to avoid cold starts after 15 min idle
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: timber-and-grain-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEV_MODE
        value: "false"     # never show OTPs on a public site
      - key: SMS_ENABLED
        value: "false"     # set "true" after wiring an SMS provider in backend/app/routers/auth.py
      - key: CORS_ORIGINS
        value: ""          # same-origin: the API serves the website itself

databases:
  - name: timber-and-grain-db
    databaseName: furniture
    plan: free
